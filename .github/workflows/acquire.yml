name: Acquire data
# Runs notebooks 01-02 (market lists and matching) against the public APIs and commits the results.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas pyarrow numpy requests jupytext nbclient ipykernel
      - name: Notebooks 01 and 02 (lists and matching)
        run: python scripts/run_notebooks.py 01 02
      - name: Commit lists and pairs
        run: |
          git config user.name "Aditya Khetarpal"
          git config user.email "80028073+AdityaKhetarpal@users.noreply.github.com"
          git add data notebooks/01_acquire.ipynb notebooks/02_match.ipynb
          git commit -m "Data: settled markets on both platforms and matched pairs" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
