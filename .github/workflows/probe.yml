name: Probe APIs
# Saves small samples of each API response used by the project (public data, no keys).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe.py
      - name: Commit samples
        if: always()
        run: |
          git config user.name "Aditya Khetarpal"
          git config user.email "80028073+AdityaKhetarpal@users.noreply.github.com"
          git add data/raw/samples
          git commit -m "API response samples" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
